<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Isaac Ihoon</title>

  <meta name="description" content="Contact Isaac Ihoon for web development and AI automation services.">

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<header>
  <div class="logo-container">
    <img src="images/logo.jpeg" alt="Isaac Ihoon Logo" class="logo" loading="lazy">
    <h1>Isaac Ihoon</h1>
  </div>

  <nav>
    <button id="menuBtn" aria-label="Toggle navigation menu">☰</button>
    <ul id="navMenu">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>
</header>

<main class=" contact-page">

  <h2>Contact</h2>

  <form id="contactForm" class="contact-form">

    <div class="form-group">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" placeholder="Enter your name" required>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="Enter your email" required>
    </div>

    <div class="form-group">
      <label for="message">Message</label>
      <textarea id="message" name="message" placeholder="Write your message..." required></textarea>
    </div>

    <button type="submit" class="btn submit-btn">Send Message</button>

    <p id="formStatus" class="form-status"></p>

  </form>

</main>

<footer>
  <p>© <span id="year"></span> Isaac Ihoon.</p>
  <p id="lastModified"></p>
  <a href="references.html">References</a>
</footer>

<script src="js/script.js"></script>
</body>
</html>
